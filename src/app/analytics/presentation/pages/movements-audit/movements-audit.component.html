<app-page-header
  title="Auditoría General de Movimientos y Cuentas"
  subtitle="Trazabilidad inmutable de ventas, liquidaciones de cierre y amortizaciones"
/>

@if (store.isLoading()) {
  <app-loading-state message="Cargando bitácora de movimientos transaccionales..." />
} @else if (store.errorMessage(); as error) {
  <p role="alert">{{ error }}</p>
} @else {
  <app-data-table
    [items]="tableItems()"
    [columns]="columns"
    emptyTitle="Sin movimientos"
    emptyMessage="No se han registrado operaciones en el período seleccionado."
  />
}
