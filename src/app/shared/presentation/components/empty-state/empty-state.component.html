<div class="empty-state-card" role="status">
  <app-ui-icon class="empty-icon" [name]="icon()" [size]="48" aria-hidden="true" />
  <h3 class="empty-title">{{ title() }}</h3>
  @if (message()) {
    <p class="empty-message">{{ message() }}</p>
  }
  <div class="empty-actions">
    <ng-content />
  </div>
</div>
