<app-page-header
  title="Cierres Mensuales y Liquidaciones"
  subtitle="Auditoría de estados de cuenta por fecha de corte y control de cartera vencida"
>
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="onRunCutoff()"
    [disabled]="store.isLoading()"
  >
    <app-ui-icon name="clipboard" [size]="16" aria-hidden="true" />
    Ejecutar corte mensual
  </button>
</app-page-header>

@if (store.isLoading()) {
  <app-loading-state message="Cargando liquidaciones mensuales..." />
} @else {
  <app-data-table
    [items]="tableItems()"
    [columns]="columns"
    emptyTitle="No hay liquidaciones"
    emptyMessage="Todavía no se han registrado cierres mensuales."
  />
}
