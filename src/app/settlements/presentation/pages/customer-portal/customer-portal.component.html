<app-page-header
  title="Portal de Cuentas Corrientes del Cliente"
  subtitle="Consulta de liquidaciones y pagos registrados"
/>

<div class="portal-layout">
  <mat-card class="client-kpi-card">
    <div class="kpi-title">Total pendiente de liquidaciones</div>
    <div class="kpi-amount">{{ amountDue().toFormatted() }}</div>
  </mat-card>

  <mat-card class="statement-card">
    <mat-card-header>
      <mat-card-title>Detalle de Liquidaciones Mensuales</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-data-table
        [items]="tableItems()"
        [columns]="columns"
        emptyTitle="Sin movimientos"
        emptyMessage="No se registran liquidaciones pendientes para su cuenta."
      />
    </mat-card-content>
  </mat-card>
</div>
