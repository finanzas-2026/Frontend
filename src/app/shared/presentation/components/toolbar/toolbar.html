<header class="shell-toolbar">
  <button
    type="button"
    class="toggle-btn"
    (click)="toggleMenu()"
    aria-label="Alternar menú lateral"
  >
    <app-ui-icon name="menu" [size]="22" aria-hidden="true" />
  </button>
  <span class="toolbar-title">Sistema de Gestión de Cuentas Corrientes</span>
  <span class="toolbar-spacer"></span>
  <button
    type="button"
    class="profile-trigger"
    [matMenuTriggerFor]="profileMenu"
    [attr.aria-label]="'Abrir perfil de ' + (authStore.currentUser()?.username ?? 'usuario')"
    aria-haspopup="menu"
  >
    <app-ui-icon name="user" [size]="20" aria-hidden="true" />
  </button>

  <mat-menu #profileMenu="matMenu" class="profile-menu-panel">
    <button mat-menu-item class="profile-summary-item" disabled>
      <span class="profile-avatar" aria-hidden="true">
        <app-ui-icon name="user" [size]="20" />
      </span>
      <span class="profile-summary-copy">
        <strong>{{ authStore.currentUser()?.username }}</strong>
        <small>{{ authStore.currentUser()?.email }}</small>
      </span>
    </button>
    <button mat-menu-item class="profile-sign-out" (click)="signOut()">
      <app-ui-icon name="logout" [size]="18" aria-hidden="true" />
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</header>
